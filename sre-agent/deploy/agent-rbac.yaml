# RBAC for the Claritty SRE Agent
# Read-only access to all resources it needs — no write permissions.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claritty-agent
  namespace: claritty
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claritty-agent-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "events", "configmaps", "services"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claritty-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claritty-agent-reader
subjects:
  - kind: ServiceAccount
    name: claritty-agent
    namespace: claritty
