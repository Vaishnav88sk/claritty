name: Build and Release clarctl

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  changelog:
    if: github.event_name == 'release' && startsWith(github.ref_name, 'v')
    name: Generate Release Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/claritty-release-notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' \
            | python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            > "$notes_file"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"

  release:
    if: github.event_name == 'push'
    name: Cross-compile and Release
    runs-on: ubuntu-latest
    env:
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/claritty-hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Run tests
        working-directory: clarctl-go
        run: go test ./...

      - name: Build release binaries
        working-directory: clarctl-go
        run: make cross

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish the Hub image
        id: hub
        uses: docker/build-push-action@v7
        with:
          context: ./sre-agent/hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.HUB_IMAGE }}:${{ github.ref_name }}

      - name: Package local stack
        env:
          HUB_DIGEST: ${{ steps.hub.outputs.digest }}
        run: |
          stack_dir=$(mktemp -d)
          cat > "$stack_dir/override.yml" <<EOF
          services:
            hub:
              build: !reset null
              image: "${HUB_IMAGE}@${HUB_DIGEST:?Missing published Hub image digest}"
          EOF
          docker compose -f docker-compose.yml -f "$stack_dir/override.yml" \
            config --no-interpolate --no-normalize --no-path-resolution > "$stack_dir/docker-compose.yml"
          docker compose -f "$stack_dir/docker-compose.yml" config --quiet
          cp "$stack_dir/docker-compose.yml" clarctl-go/dist/claritty-compose.yml
          tar -czf clarctl-go/dist/clarctl-stack.tar.gz -C "$stack_dir" docker-compose.yml

      - name: Create checksums
        working-directory: clarctl-go/dist
        run: sha256sum clarctl-* claritty-compose.yml > checksums.txt

      - name: Generate notes for a new release
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lookup_error="$RUNNER_TEMP/claritty-release-lookup.err"
          if gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2> "$lookup_error"; then
            exit 0
          fi
          if ! grep -Fq '(HTTP 404)' "$lookup_error"; then
            cat "$lookup_error" >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/claritty-release-notes.md"
          python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            < /dev/null > "$notes_file"
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            clarctl-go/dist/clarctl-linux-amd64
            clarctl-go/dist/clarctl-linux-arm64
            clarctl-go/dist/clarctl-darwin-amd64
            clarctl-go/dist/clarctl-darwin-arm64
            clarctl-go/dist/clarctl-windows-amd64.exe
            clarctl-go/dist/clarctl-stack.tar.gz
            clarctl-go/dist/claritty-compose.yml
            clarctl-go/dist/checksums.txt
