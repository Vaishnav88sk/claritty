# Set to the Hub image reference. Use a digest for production.
image: ""
imagePullPolicy: IfNotPresent

# Contains DATABASE_URL and CLARITTY_HUB_API_KEY. SLACK_WEBHOOK_URL is optional.
existingSecret: ""
slackChannel: "#sre-alerts"

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
