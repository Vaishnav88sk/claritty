apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: claritty-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8822
      {{- if .Values.edge.enabled }}
      targetPort: dashboard
    - name: ingest
      port: 8823
      targetPort: ingest
      {{- else }}
      targetPort: http
      {{- end }}
