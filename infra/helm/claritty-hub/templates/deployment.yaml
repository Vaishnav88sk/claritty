{{- $secret := required "existingSecret is required" .Values.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claritty-hub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claritty-hub
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8822
            - name: ops
              containerPort: 8824
            {{- if .Values.edge.enabled }}
            - name: ingest
              containerPort: 8823
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: DATABASE_URL
            - name: CLARITTY_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: CLARITTY_HUB_API_KEY
            - name: CLARITTY_REQUIRE_HUB_API_KEY
              value: "true"
            - name: HUB_AUTO_MIGRATE
              value: "false"
            - name: HUB_MANAGEMENT_ADDR
              value: ":8824"
            {{- if .Values.edge.enabled }}
            - name: HUB_INGEST_ADDR
              value: ":8823"
            - name: HUB_PUBLIC_URL
              value: {{ printf "https://%s" .Values.edge.dashboardHost | quote }}
            {{- end }}
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: SLACK_WEBHOOK_URL
                  optional: true
            - name: SLACK_CHANNEL
              value: {{ .Values.slackChannel | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: ops
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.edge.enabled }}
        {{- include "claritty-hub.oidcProxy" . | nindent 8 }}
        {{- end }}
