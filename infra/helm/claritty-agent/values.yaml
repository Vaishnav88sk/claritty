# Published releases use docker.io/vaishnav88sk/claritty-ai-sre-agent by digest.
# Set an explicit image when installing this chart from source.
image: ""
imagePullPolicy: IfNotPresent

clusterName: ""
hubURL: ""
# Contains CLARITTY_HUB_API_KEY and the selected provider's API key, if needed.
existingSecret: ""

autoWatch: true
scanIntervalSeconds: 300
# Empty watches all namespaces. An explicit list scopes namespace-level RBAC.
watchNamespaces: []
controlEnabled: false
replicaCount: 1
leaderElection:
  enabled: false

monitoring:
  enabled: false
  labels: {}
  interval: 30s

llm:
  provider: groq
  model: ""
  ollamaHost: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
